name: Validate Data Catalog

on:
  push:
    paths:
      - 'catalog.json'
      - 'schemas/**'
      - 'scripts/validate_catalog.py'
  pull_request:
    paths:
      - 'catalog.json'
      - 'schemas/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run catalog validator
        run: python scripts/validate_catalog.py
